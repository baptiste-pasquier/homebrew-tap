name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: shellcheck bin/git-cwt

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bin/git-cwt --help | grep -q 'usage: git cwt'
      - run: bin/git-cwt --version
      - name: fails outside a repository
        run: |
          cd "$(mktemp -d)"
          if "$GITHUB_WORKSPACE/bin/git-cwt" 2>/dev/null; then
            echo "expected a non-zero exit outside a git repository" >&2
            exit 1
          fi
